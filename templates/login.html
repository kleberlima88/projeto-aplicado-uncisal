<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Diário de Triatlo</title>
    <!-- Aqui estamos conectando aquele arquivo CSS que você criou na pasta static -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="login-container">
        
        <!-- A Logo do seu projeto (lembre-se de usar a extensão correta que você salvou, .png ou .jpg) -->
        <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Logo Diário de Triatlo" class="logo-login">
        
        <!-- AVISOS DO FLASK (Não mexer): Isso exibe a mensagem de "Credenciais inválidas" que vem do app.py -->
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            <div class="mensagem-alerta">
              {% for category, message in messages %}
                <p>{{ message }}</p>
              {% endfor %}
            </div>
          {% endif %}
        {% endwith %}

        <!-- O Formulário de Login que envia os dados para o Python validar -->
        <form action="/login" method="POST">
            <div class="input-group">
                <input type="text" name="usuario" placeholder="Usuário" required>
            </div>
            <div class="input-group">
                <input type="password" name="senha" placeholder="Senha" required>
            </div>
            <button type="submit" class="btn-entrar">Entrar no Sistema</button>
        </form>
        
    </div>
</body>
</html>
