name: Deploy to Oracle Cloud

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Executar comandos no Servidor via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          script: |
            cd /home/ubuntu
            if [ ! -d "diario-triatlo" ]; then
              git clone https://github.com/kleberlima88/projeto-aplicado-uncisal.git diario-triatlo
            fi
            cd diario-triatlo
            git fetch --all
            git clean -fd
            git reset --hard origin/main
            sudo systemctl restart nginx || true
           sudo systemctl restart diario-triatlo
